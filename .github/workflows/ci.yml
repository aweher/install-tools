name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck install.sh lib/*.sh tools/*.sh

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Run tests
        run: bats tests/
