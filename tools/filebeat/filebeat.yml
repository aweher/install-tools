filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/*.log
  symlinks: true

output.logstash:
  hosts:
    - {{GRAYLOG_HOST}}:5044

# ================================= Processors ===============================
processors:
  - add_host_metadata: ~
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

# ================================= Logging =================================
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# ================================= Modules  =================================
filebeat.config.modules:
  # Glob pattern for configuration loading
  path: ${path.config}/modules.d/*.yml

  # Set to true to enable config reloading
  reload.enabled: false
